<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Hospital System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-hospital"></i> MediCare</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Departments</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">My Appointments</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Admin Panel</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-light text-primary ms-3 px-3 rounded-pill fw-bold" href="#">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT BLOCK -->
    <div class="container mt-4">
        <!-- ADD THIS BLOCK FOR MESSAGES -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        <!-- END MESSAGE BLOCK -->
        {% block content %}

        {% endblock %}
    </div>

    <!-- FOOTER -->
    <footer class="text-center text-muted py-4 mt-5 border-top">
        <p>&copy; 2026 MediCare Hospital System. All rights reserved.</p>
    </footer>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
