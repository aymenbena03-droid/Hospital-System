{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="text-center fw-bold text-primary mb-4">Edit Profile</h3>
                
                <!-- Notice the enctype="multipart/form-data" for image uploads! -->
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% crispy form %}
                    
                    <button type="submit" class="btn btn-primary w-100 rounded-pill mt-3">Save Changes</button>
                </form>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
